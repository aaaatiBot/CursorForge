name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore CursorForge.slnx

    - name: Build solution (-warnaserror)
      run: dotnet build CursorForge.slnx --no-restore --configuration Release -warnaserror

    - name: Run test suite
      run: dotnet test CursorForge.Tests/CursorForge.Tests.csproj --no-restore --configuration Release --verbosity normal
